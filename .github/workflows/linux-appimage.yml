# Builds the Linux AppImage (linux/appimage/build.sh) on every push and pull request, and publishes it:
#   - a push to main: the "continuous" pre-release (always the latest build; the tag moves to that commit)
#   - a pushed tag v*: a release of that name
# Every run also keeps it in the run's Artifacts. Built on Ubuntu 22.04 so the AppImage runs on distributions with
# glibc 2.35 or newer.
name: Linux AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # (the releases)

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl unzip file \
            libgles-dev libegl-dev fonts-dejavu-core libegl-mesa0 libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev libudev-dev libdbus-1-dev

      - name: Cache SDL2 build
        uses: actions/cache@v4
        with:
          path: build/linux-sdl/install
          key: sdl2-2.32.10-ubuntu-22.04-${{ hashFiles('linux/appimage/build.sh') }}

      - name: Build AppImage
        run: ./linux/appimage/build.sh

      # Starts the packaged AppImage without a display (SDL's offscreen driver, Mesa's software OpenGL ES) and has
      # its autotest take a picture of the launcher: the build fails if the game can't start or draw.
      - name: Smoke test
        run: |
          printf '90 shot launcher\n100 quit\n' > "$RUNNER_TEMP/smoke.txt"
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy XDG_DATA_HOME="$RUNNER_TEMP/xdg" \
            timeout 120 dist/*.AppImage --appimage-extract-and-run \
              --autotest "$RUNNER_TEMP/shots" "$RUNNER_TEMP/smoke.txt" --capture-size 1280x720
          test -s "$RUNNER_TEMP/shots/launcher.png"
          mkdir -p smoke && cp "$RUNNER_TEMP/shots/launcher.png" smoke/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Mickey_Donald_Collection-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-launcher
          path: smoke/launcher.png
          if-no-files-found: ignore

      # main: replace the "continuous" pre-release's AppImage with this build's, and move its tag here.
      # (a tag pushed with the workflow's own token doesn't start another run)
      - name: Publish continuous release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f continuous "$GITHUB_SHA"
          git push -f origin refs/tags/continuous
          notes="The latest Linux build of main (commit ${GITHUB_SHA::7}), made automatically on every push.

          \`chmod +x\` the AppImage and run it. Put the ROMs (zipped is fine) next to the AppImage or in a \`roms\` folder beside it. See [linux/README.md](https://github.com/$GITHUB_REPOSITORY/blob/main/linux/README.md)."
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous --prerelease --title "Linux AppImage (latest build)" --notes "$notes"
            for a in $(gh release view continuous --json assets -q '.assets[].name'); do
              gh release delete-asset continuous "$a" -y
            done
          else
            gh release create continuous --prerelease --title "Linux AppImage (latest build)" --notes "$notes"
          fi
          gh release upload continuous dist/*.AppImage --clobber

      # A pushed tag v*: a release of that name with the AppImage (created, or the AppImage replaced if it exists).
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/*.AppImage --clobber
